# Starts a new build of the list every 6 hours. The build itself runs in
# Workers Builds (see the README). This Worker only calls the deploy hook, so
# it fits in the 10 ms CPU limit of the free plan.
#
# Deploy it by hand once:   npx wrangler deploy --config cron/wrangler.toml
# Set the hook URL once:    npx wrangler secret put DEPLOY_HOOK_URL --config cron/wrangler.toml
name = "cookbook-cron"
main = "index.js"
compatibility_date = "2026-10-01"
# No public address: the Worker only runs on its schedule.
workers_dev = false
preview_urls = false

[triggers]
# Off the hour so it does not land with every other cron.
crons = ["17 */6 * * *"]

[observability]
enabled = true
